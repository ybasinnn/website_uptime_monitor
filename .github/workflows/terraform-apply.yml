name: 'Terraform Apply on Push to Main'
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'images/**'
      - 'docs/**'
      - '.gitignore'
  # Manual trigger so the infrastructure can be recreated after a destroy
  workflow_dispatch:

env:
  TF_CLOUD_ORGANIZATION: "YordanOrg"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "website_check_serverless"
  CONFIG_DIRECTORY: "./"

jobs:
  terraform:
    if: github.repository != 'ybasinnn/terraform-aws-website-uptime-monitor'
    name: "Terraform Apply"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Terraform run logs are public on this repo; hide the AWS account ID in ARNs
      - name: Mask AWS account ID
        env:
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          if [ -n "$AWS_ACCOUNT_ID" ]; then
            echo "::add-mask::$AWS_ACCOUNT_ID"
          else
            echo "::warning::AWS_ACCOUNT_ID secret is not set; the account ID will appear in these public logs."
          fi

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@4c569ffb1a0f1bf0daf00539abb505bcd246748a # v1.0.0
        id: apply-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}

      - name: Create Apply Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@4c569ffb1a0f1bf0daf00539abb505bcd246748a # v1.0.0
        id: apply-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.apply-upload.outputs.configuration_version_id }}

      - name: Apply
        uses: hashicorp/tfc-workflows-github/actions/apply-run@4c569ffb1a0f1bf0daf00539abb505bcd246748a # v1.0.0
        if: fromJSON(steps.apply-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: apply
        with:
          run: ${{ steps.apply-run.outputs.run_id }}
          comment: "Apply Run from GitHub Actions CI ${{ github.sha }}"