name: 'Terraform Destroy (manual)'
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to tear down all infrastructure in the workspace'
        required: true
        type: string

env:
  TF_CLOUD_ORGANIZATION: "YordanOrg"
  TF_API_TOKEN: "${{ secrets.TF_API_TOKEN }}"
  TF_WORKSPACE: "website_check_serverless"
  CONFIG_DIRECTORY: "./"

# Never run a destroy alongside another destroy
concurrency:
  group: terraform-destroy
  cancel-in-progress: false

jobs:
  terraform:
    if: github.repository != 'ybasinnn/terraform-aws-website-uptime-monitor'
    name: "Terraform Destroy"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'destroy'
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          echo "::error::Confirmation must be exactly 'destroy' (got '$CONFIRM'). Nothing was destroyed."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      # HCP Terraform locks the workspace while any run (e.g. a local CLI plan or
      # the apply-on-push run) is active, and tfci refuses to queue a destroy on a
      # locked workspace. Wait for the lock to clear instead of failing outright.
      - name: Wait for workspace to unlock
        env:
          LOCK_TIMEOUT_SECONDS: 600
        run: |
          url="https://app.terraform.io/api/v2/organizations/$TF_CLOUD_ORGANIZATION/workspaces/$TF_WORKSPACE"
          deadline=$(( $(date +%s) + LOCK_TIMEOUT_SECONDS ))
          while :; do
            ws=$(curl -sf -H "Authorization: Bearer $TF_API_TOKEN" -H "Content-Type: application/vnd.api+json" "$url")
            if [ "$(jq -r '.data.attributes.locked' <<<"$ws")" != "true" ]; then
              echo "Workspace is unlocked (resources under management: $(jq -r '.data.attributes["resource-count"]' <<<"$ws"))."
              break
            fi
            holder=$(jq -r '.data.relationships["locked-by"].data | "\(.type)/\(.id)"' <<<"$ws")
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Workspace still locked by $holder after ${LOCK_TIMEOUT_SECONDS}s. Finish or discard that run in HCP Terraform and retry."
              exit 1
            fi
            echo "Workspace locked by $holder, waiting 15s..."
            sleep 15
          done

      - name: Upload Configuration
        uses: hashicorp/tfc-workflows-github/actions/upload-configuration@v1.3.2
        id: destroy-upload
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          directory: ${{ env.CONFIG_DIRECTORY }}

      - name: Create Destroy Run
        uses: hashicorp/tfc-workflows-github/actions/create-run@v1.3.2
        id: destroy-run
        with:
          workspace: ${{ env.TF_WORKSPACE }}
          configuration_version: ${{ steps.destroy-upload.outputs.configuration_version_id }}
          is_destroy: true
          message: "Destroy Run from GitHub Actions by ${{ github.actor }} (${{ github.sha }})"

      - name: Apply Destroy
        uses: hashicorp/tfc-workflows-github/actions/apply-run@v1.3.2
        if: fromJSON(steps.destroy-run.outputs.payload).data.attributes.actions.IsConfirmable
        id: destroy-apply
        with:
          run: ${{ steps.destroy-run.outputs.run_id }}
          comment: "Destroy Run from GitHub Actions by ${{ github.actor }} (${{ github.sha }})"

      - name: Summary
        if: always() && steps.destroy-run.outputs.run_id != ''
        env:
          RUN_LINK: ${{ steps.destroy-run.outputs.run_link }}
          RUN_STATUS: ${{ steps.destroy-apply.outputs.run_status || steps.destroy-run.outputs.run_status }}
        run: |
          {
            echo "### Terraform Destroy"
            echo "Run: $RUN_LINK"
            echo "Status: $RUN_STATUS"
          } >> "$GITHUB_STEP_SUMMARY"
